[package]
name = "znote"
version = "0.5.0"
description = "A local Markdown editor and reader"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
rfd = "0.15"
base64 = "0.22"
webbrowser = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
