name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install uv
      - name: Validate version and release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            node scripts/check-release-version.mjs $env:GITHUB_REF_NAME
          } else {
            node scripts/check-release-version.mjs
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: pnpm test
      - name: Build desktop and NSIS installer
        run: pnpm run tauri build
      - name: Validate native behavior
        # Match Tauri's release profile and feature set to reuse compiled dependencies.
        # The application test harness still needs its own compilation and linking.
        run: cargo test --release --locked --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml
      - name: Package portable application
        run: .venv/Scripts/python.exe scripts/package-release.py
      - name: Hash the installer
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -LiteralPath ($_.FullName + '.sha256') -Encoding utf8NoBOM
          }
      - name: Upload installers and portable application
        id: artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ZNote-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*.sha256
            release/*.zip
            release/*.sha256
          if-no-files-found: error
          # The installer and portable ZIP are already compressed.
          compression-level: 0
      - name: Show download location
        env:
          ARTIFACT_URL: ${{ steps.artifacts.outputs.artifact-url }}
        shell: pwsh
        run: |
          $releaseMessage = '本次为分支构建，只上传 Artifacts，不创建 GitHub Release。'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $releaseMessage = '本次为标签构建，下一步会创建 GitHub Release 草稿；验证后需手动发布草稿。'
          }
          @(
            '## Windows 构建产物'
            ''
            "[下载 ZNote-windows-x64]($env:ARTIFACT_URL)（需要登录 GitHub）"
            ''
            '解压下载的产物后，可找到 NSIS 安装器、便携 ZIP 和 SHA-256 校验文件。'
            ''
            $releaseMessage
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
      - name: Create a reviewable release draft
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME --draft --verify-tag --title "ZNote $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $artifacts = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe, src-tauri/target/release/bundle/nsis/*.sha256, release/*.zip, release/*.sha256 | ForEach-Object { $_.FullName })
          gh release upload $env:GITHUB_REF_NAME @artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
