name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install uv
      - name: Validate version and release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            node scripts/check-release-version.mjs $env:GITHUB_REF_NAME
          } else {
            node scripts/check-release-version.mjs
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: pnpm test
      - name: Build desktop and NSIS installer
        run: pnpm run tauri -- build
      - name: Validate native behavior
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Package portable application
        run: .venv/Scripts/python.exe scripts/package-release.py
      - name: Hash the installer
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -LiteralPath ($_.FullName + '.sha256') -Encoding utf8NoBOM
          }
      - uses: actions/upload-artifact@v7
        with:
          name: ZNote-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*.sha256
            release/*.zip
            release/*.sha256
          if-no-files-found: error
      - name: Create a reviewable release draft
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME --draft --verify-tag --title "ZNote $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $artifacts = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe, src-tauri/target/release/bundle/nsis/*.sha256, release/*.zip, release/*.sha256 | ForEach-Object { $_.FullName })
          gh release upload $env:GITHUB_REF_NAME @artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
